name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The order mirrors `npm run` in CLAUDE.md: cheap checks first, so a
      # formatting slip fails in seconds rather than after a browser download.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Validate content
        run: npm run content:validate

      - name: Balance gates (BALANCE.md §10)
        run: npm run sim

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Smoke tests
        run: npm run smoke
        env:
          # The A9 browser floor: Chrome/Edge, Firefox and Safari (ARCHITECTURE §6).
          PLAYWRIGHT_ALL_BROWSERS: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
