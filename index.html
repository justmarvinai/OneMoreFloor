<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="OneMoreFloor — a single-player Fantasy-RPG roguelike tower-climber."
    />
    <!--
      Icons are declared relatively so the built game stays location-independent
      for the later Electron wrap (ARCHITECTURE §6). `favicon.ico` also sits at
      the site root, because the browser asks for that one by absolute path on
      its own — without it every player's console carries a 404, which is exactly
      the kind of unfinished edge §2.1 forbids.
    -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>OneMoreFloor</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Shown by CSS below the supported window width (Brief §20.6). Written in
         markup rather than script so it survives even a failed boot. -->
    <div class="omf-too-small" data-fui-theme="stone-vine">
      <div>
        <h1>A little more room, adventurer</h1>
        <p>
          OneMoreFloor is built for desktop screens. Widen the window to at least 1280 pixels to
          play.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
